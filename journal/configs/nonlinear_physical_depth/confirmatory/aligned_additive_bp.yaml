output_dir: nonlinear_physical_depth_runs
slurm_config:
  account: kempner_dev
  partition: kempner_requeue
  time: 02:00:00
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 4
  mem: 32GB
  max_concurrent_jobs: 8
  modules_to_load: []
  conda_env_path: ''
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
  run_name: neurips_hierarchical_gain_inventory_pilot_revision
experiment_settings:
  seeds_per_condition: 10
  base_seed: 10200
  use_array_jobs: true
sweep_config:
  model.core.population_network.layers.0.populations.0.branch_factors:
  - - 8
  - - 2
    - 3
  - - 2
    - 1
    - 2
base_config:
  experiment:
    seed: 13200
    train_valid_split: 0.9
    enable_profiling: false
    enable_hooks: false
  data:
    dataset_name: hierarchical_gain_load
    base_dir: ''
    processing:
      flatten: true
      normalize: false
    dataset_params:
      hierarchical_gain_load:
        n_samples: 10000
        stream_dim: 64
        n_levels: 3
        hierarchy_branching: 2
        n_flat_groups: 8
        n_classes: 2
        e_baseline: 5.0
        i_baseline: 2.0
        sensor_e_baseline: 0.02
        e_signal_delta: 0.8
        i_signal_delta: 0.0
        signal_mode: e_only
        signal_profile: distal_only
        nuisance_layout: factorized_sensors
        gain_structure: hierarchical
        gain_scale_decay: 1.0
        train_gain_sigma: 0.25
        test_gain_sigma: 0.25
        sensor_alignment_alpha: 1.0
        sensor_support_mode: matched
        private_gain_sigma: 0.0
        independent_noise_std: 0.08
        load_mean: 0.0
        load_noise_sigma: 0.0
        valid_split_mode: train
  model:
    task: classification
    encoder:
      type: identity
      params:
        input_dim: null
    core:
      type: population_network
      population_network:
        use_transfer: true
        transfer_params:
          input_mode: 1
          independent_pathways: true
          excitatory_dim: 64
          inhibitory_dim: 64
          split_strategy: ordered
          input_mode1_build_inhibitory_population: false
          allow_direct_inhibitory_stream: true
          output_activation: null
        layers:
        - name: layer0
          readout_population: e
          population_defaults:
            ff_excitatory_synapses: 16
            ff_inhibitory_synapses: 12
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: false
            use_shunting: false
            use_additive_normalization: false
            additive_mode: raw
            reactivate: false
            reactivation_type: identity
            reactivation_init_policy: analytical
            reactivation_init_m: 1.5
            reactivation_init_b: 0.5
            dbl_init_method: mechanism_neutral
            adaptive_initialization: false
            weight_transform: softplus
            topk_type: standard
            topk_init_method: xavier_normal
            structured_connectivity:
              enabled: true
              pathways:
                ee:
                  method: inventory_feature_blocks
                  owner_count: 64
                  inventory_counts:
                  - 4
                  - 2
                  - 2
                  feature_ranges:
                  - - 0
                    - 21
                  - - 21
                    - 43
                  - - 43
                    - 64
                ie:
                  method: inventory_feature_blocks
                  owner_count: 64
                  inventory_counts:
                  - 4
                  - 2
                  - 2
                  feature_ranges:
                  - - 0
                    - 21
                  - - 21
                    - 43
                  - - 43
                    - 64
            initial_child_conductance: 16.0
          populations:
          - name: e
            polarity: excitatory
            n_neurons: 64
            branch_factors:
            - 8
          connections:
          - source: input_e
            target: e
          - source: input_i
            target: e
    decoder:
      type: MLP
      params:
        hidden_dims: []
        activation: relu
        output_dim: 2
  training:
    encoder:
      strategy: standard
      common:
        epochs: 0
    main:
      strategy: standard
      common:
        epochs: 180
        batch_size: 256
        shuffle: true
        loss_function: ce
        early_stopping: true
        patience: 30
        load_best_state_dict: true
        plot_losses: false
        suppress_prints: false
        print_every: 10
        use_amp: false
        enable_nan_checking: true
        grad_clip_value: 5.0
        weight_decay_rate: 0.01
        weight_boosting: true
        checkpointing: true
        checkpoint_interval: 25
        param_groups:
          lr: 0.003
          split_params: false
          topk_lr: 0.0015
          blocklinear_lr: 0.0007
          reactivation_lr: 0.0
          decoder_lr: 0.0015
      optimizer:
        name: adam
        lr: 0.003
      strategies:
        standard: {}
      learning_strategy_config:
        rule_variant: 3f
        error_mode: auto
        error_broadcast_mode: per_soma_shared
        broadcast_bandwidth: full
        error_noise_sigma: 0.0
        decoder_update_mode: local
        encoder_update_mode: none
        update_reactivation: false
        update_inactive_weights: false
        normalize_by_batch: true
        clip_grad_value: 5.0
        three_factor:
          dynamics_mode: auto
          use_conductance_scaling: true
          use_driving_force: true
          theta: 0.0
          e_rev_exc: 1.0
          e_rev_inh: 0.0
        morphology_aware:
          use_path_propagation: false
          morphology_modulator_mode: none
          use_dendritic_normalization: false
        hsic:
          enabled: false
          weight: 0.0
  analysis:
    performance:
      enabled: true
      training: true
      params:
        accuracy: true
        auc: true
        categorical_loglikelihood: true
    information:
      enabled: false
    compartment_statistics:
      enabled: false
      training: false
  wandb:
    use_wandb: false
  outputs:
    run_name: journal_confirmatory_physical_depth_aligned_additive_bp
    results_dir: outputs
  distributed:
    mode: none
outputs:
  run_name: journal_confirmatory_physical_depth_aligned_additive_bp
sweep_contract:
  expected_config_count: 30
  status: confirmatory_fresh_seed
  selected_from_exploratory_signal: 0.8
  regime: aligned
  mechanism: additive
  strategy: standard
