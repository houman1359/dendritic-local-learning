extends: ../reruns/feedback_definition_shunting_15seed.yaml

output_dir: drafts/dendritic-local-learning/journal/fashion_feedback_runs

slurm_config:
  max_concurrent_jobs: 8

experiment_settings:
  seeds_per_condition: 10
  base_seed: 10200

sweep_contract:
  expected_config_count: 30

sweep_config:
  training.main.learning_strategy_config.error_broadcast_mode:
    - per_soma
    - per_soma_shared
    - path_transport

base_config:
  data:
    dataset_name: fashion_mnist
  outputs:
    run_name: journal_fashion_feedback_ladder_shunting
