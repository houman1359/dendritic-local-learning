output_dir: drafts/local-learning-journal/prospective_runs
slurm_config:
  account: kempner_dev
  partition: kempner_requeue
  time: 01:00:00
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 4
  mem: 48GB
  max_concurrent_jobs: 1
  modules_to_load: []
  conda_env_path: ''
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
experiment_settings:
  seeds_per_condition: 1
  base_seed: 42
  use_array_jobs: true
sweep_contract:
  expected_config_count: 2
sweep_config:
  model.core.connectivity.structured.enabled:
  - false
  - true
  training.main.learning_strategy_config.error_broadcast_mode:
  - per_soma_shared
base_config:
  experiment:
    seed: 42
    train_valid_split: 0.8
    enable_amp: false
    enable_profiling: false
    enable_hooks: true
  data:
    dataset_name: mnist
    base_dir: data
    processing:
      flatten: true
      normalize: false
  model:
    task: classification
    encoder:
      type: identity
      params:
        input_dim: null
    core:
      type: dendritic_shunting
      architecture:
        excitatory_layer_sizes:
        - 128
        inhibitory_layer_sizes: []
        excitatory_branch_factors:
        - 2
        - 2
        - 2
        - 2
        inhibitory_branch_factors:
        - 1
      connectivity:
        ee_synapses_per_branch_per_layer:
        - 21
        ei_synapses_per_branch_per_layer:
        - 0
        ie_synapses_per_branch_per_layer:
        - 11
        ii_synapses_per_branch_per_layer:
        - 0
        structured:
          enabled: false
          method: spatial_morphology
          seed: 42
          spatial:
            input_shape:
            - 1
            - 28
            - 28
            split_axes:
            - height
            - width
            - height
            - width
      transfer:
        input_mode: 1
        independent_pathways: false
        output_activation: null
      morphology:
        somatic_synapses: false
        weight_transform: softplus
      reactivation:
        enabled: true
        type: param_tanh
        init_policy: analytical
        init_m: 1.5
        init_b: 0.5
      sparsity:
        init_method: xavier_normal
        noise_level: 0.0
        type: indexed
        weight_norm_order: null
        gamma: 1.0
        gradient_scaling: none
        indexed:
          seed: null
          index_dtype: int32
          output_chunk_size: 2048
          workspace_mb: 128
          cache_transformed_weights: false
          recompute_backward: false
          persistent_indices: true
          init_mode: per_rank
    decoder:
      type: MLP
      params:
        hidden_dims: []
        activation: relu
        output_dim: 10
  training:
    main:
      strategy: local_ca
      common:
        epochs: 180
        batch_size: 256
        shuffle: true
        loss_function: cat_nll
        early_stopping: false
        patience: 30
        load_best_state_dict: true
        plot_losses: false
        suppress_prints: false
        print_every: 10
        use_amp: false
        enable_nan_checking: false
        enable_adaptive_clipping: false
        weight_decay_rate: 0.0
        weight_boosting: false
        checkpointing: false
        param_groups:
          lr: 0.0008
          split_params: true
          topk_lr: 0.0015
          blocklinear_lr: 0.0007
          reactivation_lr: 0.0005
          decoder_lr: 0.0015
      learning_strategy_config:
        rule_variant: 3f
        error_mode: auto
        error_broadcast_mode: per_soma_shared
        error_noise_sigma: 0.0
        decoder_update_mode: local
        update_reactivation: true
        update_inactive_weights: false
        normalize_by_batch: true
        clip_grad_value: 5.0
        freeze_reactivation_epochs: 0
        freeze_decoder_epochs: 0
        training_schedule: null
        three_factor:
          dynamics_mode: auto
          use_conductance_scaling: true
          use_driving_force: true
          theta: 0.0
          e_rev_exc: 1.0
          e_rev_inh: 0.0
          additive_gain_mode: none
        four_factor:
          rho_mode: dot
          rho_estimator: ema
          ema_alpha: 0.1
          layer_wise_rho_scale: 0.0
          augment_k: 8
          augment_noise_sigma: 0.01
        five_factor:
          phi_mode: conditional
          phi_estimator: conditional_ema
          phi_ridge_lambda: 0.001
          layer_wise_phi_scale: 0.0
          rls_forgetting: 0.99
        morphology_aware:
          use_path_propagation: false
          morphology_modulator_mode: none
          morphology_depth_offset: 1.0
          morphology_centrality_metric: betweenness
          use_dendritic_normalization: false
          use_branch_type_rules: false
          apical_branch_scale: 1.0
          basal_branch_scale: 1.0
          use_branch_length_modulation: false
        hsic:
          enabled: false
          weight: 0.0
          self_weight: 0.3
          target_weight: 0.3
          target_source: labels
          kernel: rbf
          sigma: 1.0
          degree: 2
          coef0: 1.0
          grad_clip_value: 0.1
          warmup_epochs: 5
          apply_last_layer_only: false
  analysis:
    performance_analysis:
      enabled: true
      training: true
      params:
        accuracy: true
        auc: false
        categorical_loglikelihood: true
        mse: false
        cosine_similarity: false
    information_analysis:
      enabled: false
      training: false
    correlation_analysis:
      enabled: false
      training: false
    ablation_analysis:
      enabled: false
      training: false
    synapse_turnover_analysis:
      enabled: false
      training: false
    noise_perturbation_analysis:
      enabled: false
      training: false
    weight_analysis:
      enabled: false
      training: false
    single_layer_contribution:
      enabled: false
      training: false
    synaptic_activation_analysis:
      enabled: false
      training: false
    branch_activation_analysis:
      enabled: false
      training: false
    compartment_statistics_analysis:
      enabled: false
      training: false
    compartment_snr_analysis:
      enabled: false
      training: false
  wandb:
    use_wandb: false
  outputs:
    run_name: journal_canary_spatial_topology_mnist_shunting_local3f
    results_dir: outputs
