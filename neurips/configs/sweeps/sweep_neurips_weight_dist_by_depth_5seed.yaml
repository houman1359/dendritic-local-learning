output_dir: /n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/neurips/local_sweep_runs
outputs:
  run_name: sweep_neurips_weight_dist_by_depth
slurm_config:
  account: kempner_dev
  partition: kempner_h100
  time: 04:00:00
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 32GB
  max_concurrent_jobs: 32
  modules_to_load: []
  conda_env_path: ''
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
experiment_settings:
  seeds_per_condition: 5
  base_seed: 42
  use_array_jobs: true
configs:
- name: wd_shunting_bp_d22
  path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
  overrides:
    experiment:
      enable_hooks: true
    model:
      core:
        architecture:
          excitatory_branch_factors:
          - 2
          - 2
        reactivation:
          init_policy: quantile
    outputs:
      run_name: wd_shunting_bp_d22
    analysis:
      weight_analysis:
        enabled: true
        training: false
        params:
          weight_distribution: true
          weight_norm: true
          sparsity: true
- name: wd_shunting_localca_d22
  path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
  overrides:
    experiment:
      enable_hooks: true
    model:
      core:
        architecture:
          excitatory_branch_factors:
          - 2
          - 2
        reactivation:
          init_policy: quantile
    training:
      main:
        strategy: local_ca
        learning_strategy_config:
          rule_variant: 5f
          error_broadcast_mode: per_soma
          decoder_update_mode: local
          update_reactivation: true
          update_inactive_weights: false
          normalize_by_batch: true
          three_factor:
            use_conductance_scaling: true
            use_driving_force: true
            theta: 0.0
            e_rev_exc: 1.0
            e_rev_inh: 0.0
          four_factor:
            rho_mode: dot
            rho_estimator: ema
    outputs:
      run_name: wd_shunting_localca_d22
    analysis:
      weight_analysis:
        enabled: true
        training: false
        params:
          weight_distribution: true
          weight_norm: true
          sparsity: true
