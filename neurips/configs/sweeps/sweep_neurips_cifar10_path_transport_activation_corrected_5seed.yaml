output_dir: "/n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/neurips/local_sweep_runs"

outputs:
  run_name: "cifar10_path_transport_activation_corrected_5seed"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100_priority3"
  time: "24:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 64GB
  max_concurrent_jobs: 64
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 5
  base_seed: 42
  use_array_jobs: true

configs:
  - name: "cifar10_additive_path_transport"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_additive_deep333_ie10_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "path_transport"
      outputs:
        run_name: "cifar10_additive_path_transport"

  - name: "cifar10_shunting_path_transport"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_shunting_deep333_ie10_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "path_transport"
      outputs:
        run_name: "cifar10_shunting_path_transport"
