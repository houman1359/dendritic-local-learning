output_dir: "/n/holylfs06/LABS/kempner_project_b/Lab/dendritic/HS/LOCAL_LEARNING/sweep_runs"

outputs:
  run_name: "sweep_neurips_cifar10_multistage_warmstart"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100_priority3"
  time: "18:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 64GB
  max_concurrent_jobs: 16
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
  use_array_jobs: true

configs:
  - name: "cifar10_shunting_multistage_localca"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_shunting_multistage_localca.yaml"
  - name: "cifar10_shunting_multistage_path_transport"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_shunting_multistage_localca.yaml"
    overrides:
      training:
        main:
          strategies:
            multi_stage:
              stages:
                - learning_strategy: "standard"
                  stage_name: "bp_warmup"
                  epochs: 100
                  batch_size: 256
                  reset_optimizer: true
                  save_checkpoint: true
                  param_groups:
                    lr: 0.001
                    split_params: true
                    topk_lr: 0.001
                    blocklinear_lr: 0.0005
                    reactivation_lr: 0.0005
                    decoder_lr: 0.001
                  trainer_config:
                    loss_function: "cat_nll"
                    early_stopping: false
                    load_best_state_dict: false
                - learning_strategy: "local_ca"
                  stage_name: "local_finetune"
                  epochs: 100
                  batch_size: 256
                  reset_optimizer: true
                  save_checkpoint: true
                  param_groups:
                    lr: 0.0001
                    split_params: true
                    topk_lr: 0.0001
                    blocklinear_lr: 0.00005
                    reactivation_lr: 0.00005
                    decoder_lr: 0.001
                  trainer_config:
                    loss_function: "cat_nll"
                    early_stopping: false
                    load_best_state_dict: false
                  local_rule_config:
                    rule_variant: "5f"
                    error_mode: "auto"
                    error_broadcast_mode: "path_transport"
                    decoder_update_mode: "local"
                    update_reactivation: true
                    update_inactive_weights: false
                    normalize_by_batch: true
                    clip_grad_value: 5.0
                    three_factor:
                      use_conductance_scaling: true
                      use_driving_force: true
                      theta: 0.0
                      e_rev_exc: 1.0
                      e_rev_inh: 0.0
                    four_factor:
                      rho_mode: "dot"
                      rho_estimator: "ema"
                      ema_alpha: 0.1
                      layer_wise_rho_scale: 0.0
                      augment_k: 8
                      augment_noise_sigma: 0.01
                    five_factor:
                      phi_mode: "conditional"
                      phi_estimator: "conditional_ema"
                      phi_ridge_lambda: 0.001
                      layer_wise_phi_scale: 0.0
                      rls_forgetting: 0.99
                    morphology_aware:
                      use_path_propagation: false
                      morphology_modulator_mode: "none"
                      use_dendritic_normalization: false
                      use_branch_type_rules: false
                    hsic:
                      enabled: false
      outputs:
        run_name: "cifar10_shunting_multistage_path_transport"
  - name: "cifar10_additive_multistage_localca"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_additive_multistage_localca.yaml"
  - name: "cifar10_additive_multistage_path_transport"
    path: "drafts/dendritic-local-learning/neurips/configs/cifar10_additive_multistage_localca.yaml"
    overrides:
      training:
        main:
          strategies:
            multi_stage:
              stages:
                - learning_strategy: "standard"
                  stage_name: "bp_warmup"
                  epochs: 100
                  batch_size: 256
                  reset_optimizer: true
                  save_checkpoint: true
                  param_groups:
                    lr: 0.001
                    split_params: true
                    topk_lr: 0.001
                    blocklinear_lr: 0.0005
                    reactivation_lr: 0.0005
                    decoder_lr: 0.001
                  trainer_config:
                    loss_function: "cat_nll"
                    early_stopping: false
                    load_best_state_dict: false
                - learning_strategy: "local_ca"
                  stage_name: "local_finetune"
                  epochs: 100
                  batch_size: 256
                  reset_optimizer: true
                  save_checkpoint: true
                  param_groups:
                    lr: 0.0001
                    split_params: true
                    topk_lr: 0.0001
                    blocklinear_lr: 0.00005
                    reactivation_lr: 0.00005
                    decoder_lr: 0.001
                  trainer_config:
                    loss_function: "cat_nll"
                    early_stopping: false
                    load_best_state_dict: false
                  local_rule_config:
                    rule_variant: "5f"
                    error_mode: "auto"
                    error_broadcast_mode: "path_transport"
                    decoder_update_mode: "local"
                    update_reactivation: true
                    update_inactive_weights: false
                    normalize_by_batch: true
                    clip_grad_value: 5.0
                    three_factor:
                      use_conductance_scaling: false
                      use_driving_force: false
                      theta: 0.0
                      e_rev_exc: 1.0
                      e_rev_inh: 0.0
                    four_factor:
                      rho_mode: "dot"
                      rho_estimator: "ema"
                      ema_alpha: 0.1
                      layer_wise_rho_scale: 0.0
                      augment_k: 8
                      augment_noise_sigma: 0.01
                    five_factor:
                      phi_mode: "conditional"
                      phi_estimator: "conditional_ema"
                      phi_ridge_lambda: 0.001
                      layer_wise_phi_scale: 0.0
                      rls_forgetting: 0.99
                    morphology_aware:
                      use_path_propagation: false
                      morphology_modulator_mode: "none"
                      use_dendritic_normalization: false
                      use_branch_type_rules: false
                    hsic:
                      enabled: false
      outputs:
        run_name: "cifar10_additive_multistage_path_transport"
