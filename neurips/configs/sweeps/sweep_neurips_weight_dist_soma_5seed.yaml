output_dir: /n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/neurips/local_sweep_runs
outputs:
  run_name: sweep_neurips_weight_dist_soma
slurm_config:
  account: kempner_dev
  partition: kempner_h100
  time: "04:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 32GB
  max_concurrent_jobs: 16
  modules_to_load: []
  conda_env_path: ''
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
experiment_settings:
  seeds_per_condition: 5
  base_seed: 42
  use_array_jobs: true

# Weight-distribution analysis with soma-on extension.
# Soma-off baseline already exists at weight_dist_by_depth_summary_20260417.
# Here we run the same 4 cells at the medium depth [3,3] but with somatic_synapses=true
# so that the soma-on weight statistics can be compared directly to the soma-off table.
# 2 strategy x 2 core = 4 conditions x 5 seeds = 20 jobs.
configs:
  - name: wdsoma_shunting_bp
    path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
    overrides:
      experiment:
        enable_hooks: true
      model:
        core:
          morphology:
            somatic_synapses: true
          architecture:
            excitatory_branch_factors: [3, 3]
          reactivation:
            init_policy: quantile
      analysis:
        weight_analysis:
          enabled: true
          training: false
          params:
            weight_distribution: true
            weight_norm: true
            sparsity: true
      outputs:
        run_name: wdsoma_shunting_bp
  - name: wdsoma_shunting_localca
    path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
    overrides:
      experiment:
        enable_hooks: true
      model:
        core:
          morphology:
            somatic_synapses: true
          architecture:
            excitatory_branch_factors: [3, 3]
          reactivation:
            init_policy: quantile
      training:
        main:
          strategy: local_ca
          learning_strategy_config:
            rule_variant: 5f
            error_broadcast_mode: per_soma
            decoder_update_mode: local
            update_reactivation: true
            update_inactive_weights: false
            normalize_by_batch: true
            three_factor:
              use_conductance_scaling: true
              use_driving_force: true
              theta: 0.0
              e_rev_exc: 1.0
              e_rev_inh: 0.0
            four_factor:
              rho_mode: dot
              rho_estimator: ema
      analysis:
        weight_analysis:
          enabled: true
          training: false
          params:
            weight_distribution: true
            weight_norm: true
            sparsity: true
      outputs:
        run_name: wdsoma_shunting_localca
  - name: wdsoma_additive_bp
    path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
    overrides:
      experiment:
        enable_hooks: true
      model:
        core:
          type: dendritic_additive
          morphology:
            somatic_synapses: true
          architecture:
            excitatory_branch_factors: [3, 3]
          reactivation:
            init_policy: quantile
      analysis:
        weight_analysis:
          enabled: true
          training: false
          params:
            weight_distribution: true
            weight_norm: true
            sparsity: true
      outputs:
        run_name: wdsoma_additive_bp
  - name: wdsoma_additive_localca
    path: drafts/dendritic-local-learning/neurips/configs/fig1_mnist_shunting_bp_fixed100.yaml
    overrides:
      experiment:
        enable_hooks: true
      model:
        core:
          type: dendritic_additive
          morphology:
            somatic_synapses: true
          architecture:
            excitatory_branch_factors: [3, 3]
          reactivation:
            init_policy: quantile
      training:
        main:
          strategy: local_ca
          learning_strategy_config:
            rule_variant: 5f
            error_broadcast_mode: per_soma
            decoder_update_mode: local
            update_reactivation: true
            update_inactive_weights: false
            normalize_by_batch: true
            three_factor:
              use_conductance_scaling: true
              use_driving_force: true
              theta: 0.0
              e_rev_exc: 1.0
              e_rev_inh: 0.0
            four_factor:
              rho_mode: dot
              rho_estimator: ema
      analysis:
        weight_analysis:
          enabled: true
          training: false
          params:
            weight_distribution: true
            weight_norm: true
            sparsity: true
      outputs:
        run_name: wdsoma_additive_localca
