experiment:
  seed: 42
  train_valid_split: 0.9
  enable_amp: false
  enable_profiling: false
  enable_hooks: true

data:
  dataset_name: "double_cifar10_contextual_mod10"
  base_dir: ""
  processing:
    flatten: true
    normalize: true
  dataset_params:
    double_cifar10_contextual_mod10:
      shuffle_iterations: 1
      pair_seed: 0
      context_seed: 123

model:
  task: "classification"
  encoder:
    type: "pathway_router"
    params:
      input_dim: 6146
      router_mode: "fixed"
      shared_indices: [6144, 6145]
      n_pathways: 2
      pathway_dim: 256
      router_activation: "none"
  core:
    type: "dendritic_shunting"
    architecture:
      excitatory_layer_sizes: [256]
      inhibitory_layer_sizes: []
      excitatory_branch_factors: [2]
      inhibitory_branch_factors: [1]
    connectivity:
      ee_synapses_per_branch_per_layer: [20]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [6]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_mode: 1
      independent_pathways: false
      output_activation: null
    morphology:
      somatic_synapses: false
      weight_transform: "softplus"
    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
  decoder:
    type: "MLP"
    params:
      hidden_dims: []
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "local_ca"
    common:
      epochs: 220
      batch_size: 256
      shuffle: true
      loss_function: "cat_nll"
      early_stopping: false
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 10
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.0012
        split_params: true
        topk_lr: 0.0012
        blocklinear_lr: 0.0006
        reactivation_lr: 0.0005
        decoder_lr: 0.0012
    learning_strategy_config:
      rule_variant: "3f"
      error_mode: "auto"
      error_broadcast_mode: "pathway_vector"
      broadcast_rank: 2
      pathway_broadcast_residual: 0.2
      pathway_activity_gate_strength: 0.75
      decoder_update_mode: "local"
      encoder_update_mode: "backprop"
      update_reactivation: true
      update_inactive_weights: false
      normalize_by_batch: true
      clip_grad_value: 5.0
      three_factor:
        use_conductance_scaling: true
        use_driving_force: true
        theta: 0.0
        e_rev_exc: 1.0
        e_rev_inh: 0.0
      morphology_aware:
        use_path_propagation: true
        path_factor_mode: "per_branch"
        morphology_modulator_mode: "none"
        use_dendritic_normalization: false
        use_branch_type_rules: false
        use_branch_role_rules: true
        branch_role_source: "router_pathways"
        specialized_branch_scale: 1.2
        mixed_branch_scale: 0.85
        branch_role_power: 1.0
        branch_role_alignment_weight: 0.4
      inhibitory_homeostasis:
        enabled: true
        mode: "r_tot"
        weight: 0.03
        target_r_tot: 0.35
      hsic:
        enabled: false

analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

wandb:
  use_wandb: false

outputs:
  run_name: "double_cifar10_contextual_routed_shunting_localca_pathway_vector"
  results_dir: "/tmp/double_cifar10_contextual_routed_shunting_localca_pathway_vector"
