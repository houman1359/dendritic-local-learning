experiment:
  seed: 42
  train_valid_split: 0.9
  enable_amp: false
  enable_profiling: false
  enable_hooks: true

data:
  dataset_name: "cifar10"
  base_dir: ""
  processing:
    flatten: true
    normalize: true

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: null
  core:
    type: "dendritic_shunting"
    architecture:
      excitatory_layer_sizes: [256]
      inhibitory_layer_sizes: []
      excitatory_branch_factors: [3, 3, 3]
      inhibitory_branch_factors: [1]
    connectivity:
      ee_synapses_per_branch_per_layer: [40]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_mode: 1
      independent_pathways: false
      output_activation: null
    morphology:
      somatic_synapses: false
      weight_transform: "softplus"
    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
  decoder:
    type: "MLP"
    params:
      hidden_dims: []
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "multi_stage"
    common:
      epochs: 260
      batch_size: 128
      shuffle: true
      loss_function: "cat_nll"
      early_stopping: false
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 10
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      checkpointing: true
      checkpoint_interval: 50
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      multi_stage:
        analyze_between_stages: true
        use_best_from_each_stage: true
        continue_on_failure: false
        stages:
          - learning_strategy: "local_ca"
            stage_name: "vhomeo_warmup"
            epochs: 100
            batch_size: 128
            reset_optimizer: true
            save_checkpoint: true
            param_groups:
              lr: 0.0007
              split_params: true
              topk_lr: 0.0007
              blocklinear_lr: 0.0002
              reactivation_lr: 0.0002
              decoder_lr: 0.001
            trainer_config:
              loss_function: "cat_nll"
              early_stopping: false
              load_best_state_dict: false
            local_rule_config:
              rule_variant: "5f_vh"
              error_mode: "auto"
              error_broadcast_mode: "per_soma"
              decoder_update_mode: "backprop"
              update_reactivation: true
              update_inactive_weights: false
              normalize_by_batch: true
              clip_grad_value: 5.0
              three_factor:
                use_conductance_scaling: true
                use_driving_force: true
                theta: 0.0
                e_rev_exc: 1.0
                e_rev_inh: 0.0
              four_factor:
                rho_mode: "dot"
                rho_estimator: "ema"
                ema_alpha: 0.1
                layer_wise_rho_scale: 0.0
                augment_k: 8
                augment_noise_sigma: 0.01
              five_factor:
                phi_mode: "conditional"
                phi_estimator: "conditional_ema"
                phi_ridge_lambda: 0.001
                layer_wise_phi_scale: 0.0
                rls_forgetting: 0.99
              morphology_aware:
                use_path_propagation: false
                morphology_modulator_mode: "none"
                use_dendritic_normalization: false
                use_branch_type_rules: false
              voltage_homeostasis:
                enabled: true
                weight: 0.05
                target_voltage: 0.5
              hsic:
                enabled: false
          - learning_strategy: "local_ca"
            stage_name: "task_finetune"
            epochs: 160
            batch_size: 128
            reset_optimizer: true
            save_checkpoint: true
            param_groups:
              lr: 0.0001
              split_params: true
              topk_lr: 0.0001
              blocklinear_lr: 0.00005
              reactivation_lr: 0.00005
              decoder_lr: 0.001
            trainer_config:
              loss_function: "cat_nll"
              early_stopping: false
              load_best_state_dict: false
            local_rule_config:
              rule_variant: "5f_vh"
              error_mode: "auto"
              error_broadcast_mode: "per_soma"
              decoder_update_mode: "backprop"
              update_reactivation: true
              update_inactive_weights: false
              normalize_by_batch: true
              clip_grad_value: 5.0
              three_factor:
                use_conductance_scaling: true
                use_driving_force: true
                theta: 0.0
                e_rev_exc: 1.0
                e_rev_inh: 0.0
              four_factor:
                rho_mode: "dot"
                rho_estimator: "ema"
                ema_alpha: 0.1
                layer_wise_rho_scale: 0.0
                augment_k: 8
                augment_noise_sigma: 0.01
              five_factor:
                phi_mode: "conditional"
                phi_estimator: "conditional_ema"
                phi_ridge_lambda: 0.001
                layer_wise_phi_scale: 0.0
                rls_forgetting: 0.99
              morphology_aware:
                use_path_propagation: false
                morphology_modulator_mode: "none"
                use_dendritic_normalization: false
                use_branch_type_rules: false
              voltage_homeostasis:
                enabled: true
                weight: 0.01
                target_voltage: 0.5
              hsic:
                enabled: false

analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  information_analysis:
    enabled: false
  correlation_analysis:
    enabled: false

wandb:
  use_wandb: false

outputs:
  run_name: "cifar10_shunting_deep333_ie10_multistage_vhomeo_localca"
  results_dir: "/tmp/cifar10_shunting_deep333_ie10_multistage_vhomeo_localca"
