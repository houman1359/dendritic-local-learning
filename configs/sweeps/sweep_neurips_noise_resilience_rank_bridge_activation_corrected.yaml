output_dir: "/n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/local_sweep_runs"

outputs:
  run_name: "noise_resilience_rank_bridge_nonnegativeinput_fix"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100_priority3"
  time: "06:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 64GB
  max_concurrent_jobs: 64
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 5
  base_seed: 42
  use_array_jobs: true

configs:
  - name: "noise_resilience_shunting_per_soma"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"

  - name: "noise_resilience_shunting_path_propagation"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            morphology_aware:
              use_path_propagation: true
              path_factor_mode: "per_branch"

  - name: "noise_resilience_shunting_low_rank_k1"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "low_rank"
            broadcast_rank: 1

  - name: "noise_resilience_shunting_low_rank_k2"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "low_rank"
            broadcast_rank: 2

  - name: "noise_resilience_shunting_low_rank_k4"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "low_rank"
            broadcast_rank: 4

  - name: "noise_resilience_shunting_low_rank_k8"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "low_rank"
            broadcast_rank: 8

  - name: "noise_resilience_shunting_path_transport"
    path: "drafts/dendritic-local-learning/configs/noise_resilience_shunting_localca_strong.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "path_transport"
