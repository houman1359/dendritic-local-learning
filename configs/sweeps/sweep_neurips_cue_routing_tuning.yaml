  mem: 32GB
  max_concurrent_jobs: 8
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 5
  base_seed: 42
  use_array_jobs: true

configs:
