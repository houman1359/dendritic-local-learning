    path: "drafts/dendritic-local-learning/configs/cue_routed_hard_learned_shunting_localca_pilot.yaml"
    overrides:
      training:
        main:
          common:
            epochs: 140
            patience: 35

  - name: "cue_hard_learned_shunting_localca_lr10_e140"
    path: "drafts/dendritic-local-learning/configs/cue_routed_hard_learned_shunting_localca_pilot.yaml"
    overrides:
      training:
        main:
          common:
            epochs: 140
            patience: 35
            param_groups:
              lr: 0.001
              split_params: true
              topk_lr: 0.001
              blocklinear_lr: 0.0005
              reactivation_lr: 0.00035
              decoder_lr: 0.0015

  - name: "cue_hard_learned_shunting_localca_pathway_vector_e140"
