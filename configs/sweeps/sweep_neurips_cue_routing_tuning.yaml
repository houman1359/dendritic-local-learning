outputs:
  run_name: "sweep_neurips_cue_routing_tuning"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_eng"
  time: "06:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
