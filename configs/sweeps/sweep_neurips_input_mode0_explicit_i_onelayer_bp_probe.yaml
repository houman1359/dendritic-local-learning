# Standard-BP ceiling for the one-feedforward-layer explicit-I architecture.
#
# If this ceiling is high while LocalCA is weak, the remaining gap is a
# credit-assignment problem through the explicit E->I->E graph, not a capacity
# problem or an artifact of using two feedforward dendritic layers.
output_dir: "/n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/local_sweep_runs"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100"
  time: "03:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 64GB
  max_concurrent_jobs: 3
  modules_to_load: []
  conda_env_path: "/n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env"
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
  use_array_jobs: true

sweep_config:
  model.core.morphology.somatic_synapses:
    - false

base_config:
  experiment:
    seed: 42
    train_valid_split: 0.8
    fast_mode: false
    deterministic: true
    enable_hooks: true
  data:
    dataset_name: "noise_resilience"
    base_dir: "/n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/data"
    processing:
      flatten: true
      normalize: false
    dataset_params:
      noise_resilience:
        sigma_task: 1.5
        noise_latent_dim: 50
        projection_seed: 0
        train_noise_seed: 1
        valid_noise_seed: 2
        test_noise_seed: 3
        clamp_inputs: true
  model:
    task: "classification"
    encoder:
      type: "identity"
      params:
        input_dim: null
    core:
      type: "dendritic_shunting"
      architecture:
        excitatory_layer_sizes: [128]
        inhibitory_layer_sizes: [128]
        excitatory_branch_factors: [3, 3]
        inhibitory_branch_factors: [3, 3]
      connectivity:
        ee_synapses_per_branch_per_layer: [40]
        ei_synapses_per_branch_per_layer: [40]
        ie_synapses_per_branch_per_layer: [20]
        ii_synapses_per_branch_per_layer: [0]
      transfer:
        input_mode: 0
        independent_pathways: false
        output_activation: relu
      morphology:
        somatic_synapses: false
        weight_transform: "softplus"
      reactivation:
        enabled: true
        type: "param_tanh"
        init_m: 1.5
        init_b: 0.5
    decoder:
      type: "MLP"
      params:
        hidden_dims: []
        activation: "relu"
        output_dim: 10
  training:
    main:
      strategy: "standard"
      common:
        epochs: 100
        batch_size: 256
        shuffle: true
        loss_function: "cat_nll"
        early_stopping: true
        patience: 25
        load_best_state_dict: true
        plot_losses: false
        suppress_prints: false
        print_every: 1
        use_amp: false
        weight_decay_rate: 0.0
        weight_boosting: false
        param_groups:
          lr: 0.0015
          split_params: true
          topk_lr: 0.0015
          blocklinear_lr: 0.0007
          reactivation_lr: 0.0005
          decoder_lr: 0.0015
  analysis:
    performance_analysis:
      enabled: true
      training: true
      params:
        accuracy: true
        categorical_loglikelihood: true
    information_analysis:
      enabled: false
      training: false
  wandb:
    use_wandb: false
  outputs:
    run_name: "input_mode0_explicit_i_onelayer_bp_probe"
    results_dir: "outputs"
