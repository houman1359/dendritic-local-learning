output_dir: /n/holylabs/kempner_dev/Users/hsafaai/Code/dendritic-modeling/drafts/dendritic-local-learning/local_sweep_runs
outputs:
  run_name: cifar10_shunting_depth4_soma_rerun
slurm_config:
  account: kempner_dev
  partition: kempner_h100
  time: "16:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 48GB
  max_concurrent_jobs: 9
  modules_to_load: []
  conda_env_path: ''
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
  use_array_jobs: true
configs:
- name: cifar10_shunting_depth4_soma_per_soma_localca_v2
  path: drafts/dendritic-local-learning/configs/cifar10_shunting_compactei_depth4_localca.yaml
  overrides:
    model:
      core:
        morphology:
          somatic_synapses: true
        reactivation:
          init_policy: quantile
    outputs:
      run_name: cifar10_shunting_depth4_soma_per_soma_localca_v2
- name: cifar10_shunting_depth4_soma_path_transport_localca_v2
  path: drafts/dendritic-local-learning/configs/cifar10_shunting_compactei_depth4_localca.yaml
  overrides:
    model:
      core:
        morphology:
          somatic_synapses: true
        reactivation:
          init_policy: quantile
    training:
      main:
        learning_strategy_config:
          error_broadcast_mode: path_transport
    outputs:
      run_name: cifar10_shunting_depth4_soma_path_transport_localca_v2
- name: cifar10_shunting_depth4_soma_low_rank_k4_localca_v2
  path: drafts/dendritic-local-learning/configs/cifar10_shunting_compactei_depth4_localca.yaml
  overrides:
    model:
      core:
        morphology:
          somatic_synapses: true
        reactivation:
          init_policy: quantile
    training:
      main:
        learning_strategy_config:
          error_broadcast_mode: low_rank
          broadcast_rank: 4
    outputs:
      run_name: cifar10_shunting_depth4_soma_low_rank_k4_localca_v2
