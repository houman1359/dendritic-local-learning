output_dir: "/n/holylfs06/LABS/kempner_project_b/Lab/dendritic/HS/LOCAL_LEARNING/sweep_runs"

outputs:
  run_name: "sweep_neurips_cifar10_strong_matched"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100_priority3"
  time: "08:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 32GB
  max_concurrent_jobs: 16
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
  use_array_jobs: true

configs:
  - name: "cifar10_shunting_standard"
    path: "drafts/dendritic-local-learning/configs/cifar10_shunting_strong_standard.yaml"
  - name: "cifar10_additive_standard"
    path: "drafts/dendritic-local-learning/configs/cifar10_additive_strong_standard.yaml"
  - name: "cifar10_shunting_localca"
    path: "drafts/dendritic-local-learning/configs/cifar10_shunting_strong_localca.yaml"
  - name: "cifar10_shunting_localca_pathprop"
    path: "drafts/dendritic-local-learning/configs/cifar10_shunting_strong_localca.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            morphology_aware:
              use_path_propagation: true
      outputs:
        run_name: "cifar10_shunting_strong_localca_pathprop"
  - name: "cifar10_shunting_path_transport"
    path: "drafts/dendritic-local-learning/configs/cifar10_shunting_strong_localca.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "path_transport"
      outputs:
        run_name: "cifar10_shunting_strong_path_transport"
  - name: "cifar10_additive_localca"
    path: "drafts/dendritic-local-learning/configs/cifar10_additive_strong_localca.yaml"
  - name: "cifar10_additive_path_transport"
    path: "drafts/dendritic-local-learning/configs/cifar10_additive_strong_localca.yaml"
    overrides:
      training:
        main:
          learning_strategy_config:
            error_broadcast_mode: "path_transport"
      outputs:
        run_name: "cifar10_additive_strong_path_transport"
