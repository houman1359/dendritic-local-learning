# Gain-shift generalization pilot — LocalCA conditions
# Companion to sweep_neurips_gain_shift_pilot.yaml (standard BP baseline)
#
# Tests LocalCA (additive and shunting) under OOD gain shift.
# Run after BP pilot confirms separation is measurable.
#
# For full sweep (if pilot shows separation), add:
#   - point_mlp + BP + LayerNorm
#   - point_mlp + BP + BatchNorm
#   - additive_dendritic + BP + LayerNorm (normalization control)
# and extend seeds_per_condition to 5.

output_dir: "/n/holylfs06/LABS/kempner_project_b/Lab/dendritic/HS/LOCAL_LEARNING/sweep_runs"

slurm_config:
  account: "kempner_dev"
  partition: "kempner_h100_priority3"
  time: "04:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 4
  mem: 32GB
  max_concurrent_jobs: 32
  modules_to_load: []
  conda_env_path: ""
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

experiment_settings:
  seeds_per_condition: 2
  base_seed: 42

sweep_config:
  model.core.type: ["dendritic_additive", "dendritic_shunting"]
  data.dataset_params.noise_resilience_gain_ood.test_gain: [1.0, 3.0, 10.0]

base_config:
  experiment:
    seed: 42
    train_valid_split: 0.8
    enable_amp: false
    enable_profiling: false
    enable_hooks: true
  data:
    dataset_name: "noise_resilience_gain_ood"
    base_dir: ""
    processing:
      flatten: true
      normalize: false
    dataset_params:
      noise_resilience_gain_ood:
        test_gain: 5.0
        train_gain: 1.0
        noise_level: 0.2
  model:
    task: "classification"
    encoder:
      type: "identity"
      params:
        input_dim: null
    core:
      type: "dendritic_shunting"
      architecture:
        excitatory_layer_sizes: [256, 256]
        inhibitory_layer_sizes: []
        excitatory_branch_factors: [3, 3]
        inhibitory_branch_factors: [1]
      connectivity:
        ee_synapses_per_branch_per_layer: [40]
        ei_synapses_per_branch_per_layer: [0]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
      transfer:
        input_mode: 1
        independent_pathways: false
        output_activation: null
      morphology:
        somatic_synapses: false
        weight_transform: "softplus"
      reactivation:
        enabled: true
        type: "param_tanh"
        init_m: 1.5
        init_b: 0.5
    decoder:
      type: "MLP"
      params:
        hidden_dims: []
        activation: "relu"
        output_dim: 3
  training:
    main:
      strategy: "local_ca"
      common:
        epochs: 150
        batch_size: 256
        shuffle: true
        loss_function: "cat_nll"
        early_stopping: true
        patience: 30
        load_best_state_dict: true
        plot_losses: false
        suppress_prints: true
        print_every: 10
        use_amp: false
        enable_nan_checking: false
        enable_adaptive_clipping: false
        weight_decay_rate: 0.0
        weight_boosting: false
        param_groups:
          lr: 0.002
          split_params: true
          topk_lr: 0.002
          blocklinear_lr: 0.001
      optimizer:
        name: "Adam"
      learning_strategy_config:
        rule_variant: "5f"
        error_broadcast_mode: "per_soma"
        decoder_update_mode: "backprop"
